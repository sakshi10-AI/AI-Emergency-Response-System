version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: emergency_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

  database:
    image: postgis/postgis:15-3.3
    container_name: emergency_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: emergency_backend_prod
    restart: always
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      - database

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: emergency_frontend_prod
    restart: always
    environment:
      - BACKEND_API_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata_prod:
