version: '3.8'

services:
  # =========================================================================
  # 1. PostgreSQL + PostGIS Database Service
  # =========================================================================
  database:
    image: postgis/postgis:15-3.3
    container_name: emergency_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-ai_emergency_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_emergency_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - emergency_net

  # =========================================================================
  # 2. Redis Telemetry & Workflow Memory Service
  # =========================================================================
  redis:
    image: redis:7.2-alpine
    container_name: emergency_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - emergency_net

  # =========================================================================
  # 3. FastAPI Multi-Agent Backend Microservice
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emergency_backend
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@database:5432/${POSTGRES_DB:-ai_emergency_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-supersecretkey123}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - emergency_net

  # =========================================================================
  # 4. Streamlit Command Center Dashboard Frontend
  # =========================================================================
  frontend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.frontend
    container_name: emergency_frontend
    restart: always
    env_file:
      - .env
    environment:
      - BACKEND_API_URL=http://backend:8000
      - WS_API_URL=ws://backend:8000/api/v1/ws
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8501/_stcore/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - emergency_net

# Named Persistent Storage Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# Isolated Bridge Container Network
networks:
  emergency_net:
    driver: bridge
